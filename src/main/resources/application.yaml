spring:
  application:
    name: live_match

  datasource:
    url: jdbc:mysql://localhost:3306/live_match_spring_api
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-docs
